openapi: 3.1.0
info:
  title: DNS and Domains (API Commons)
  version: 0.1.0-draft.20261111
  description: 'The common DNS and Domains interface, distilled from the harvested OpenAPI of 69 providers in the
    APIs.io catalog. Not a product: no one serves this API. It is the shape the market already shares, measured,
    so that providers, agents and integrators can map to one vocabulary. See profile.yml.'
  license:
    name: CC BY-NC-SA 4.0
    url: https://creativecommons.org/licenses/by-nc-sa/4.0/
paths:
  /domains:
    get:
      operationId: listDomains
      summary: List domains
      tags:
      - Domains
      x-commons-tier: core
      x-commons-share: 0.87
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: &id001
                  $ref: '#/components/schemas/Domain'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
      - name: cursor
        in: query
        schema:
          type: string
    post:
      operationId: createDomain
      summary: Create a domain
      tags:
      - Domains
      x-commons-tier: core
      x-commons-share: 0.696
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema: *id001
  /domains/{domain_id}:
    parameters:
    - $ref: '#/components/parameters/domain_id'
    get:
      operationId: getDomain
      summary: Get a domain
      tags:
      - Domains
      x-commons-tier: core
      x-commons-share: 0.696
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id001
    delete:
      operationId: deleteDomain
      summary: Delete a domain
      tags:
      - Domains
      x-commons-tier: core
      x-commons-share: 0.522
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id001
    patch:
      operationId: updateDomain
      summary: Update a domain
      tags:
      - Domains
      x-commons-tier: core
      x-commons-share: 0.522
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema: *id001
  /zones:
    get:
      operationId: listZones
      summary: List zones
      tags:
      - Zones
      x-commons-tier: core
      x-commons-share: 1.0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
